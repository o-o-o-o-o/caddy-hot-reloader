name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update formula to (e.g., v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get release info
        id: release
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "url=https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz" >> $GITHUB_OUTPUT

      - name: Calculate SHA256
        id: sha
        run: |
          curl -sfL "${{ steps.release.outputs.url }}" -o release.tar.gz
          echo "sha256=$(sha256sum release.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          rm release.tar.gz

      # Commit straight to main with the built-in token: the PR + automerge
      # route needs a PAT (GITHUB_TOKEN events don't trigger other
      # workflows), and the formula PR merged without review anyway.
      - name: Update formula and push
        run: |
          sed -i "s|url \".*\"|url \"${{ steps.release.outputs.url }}\"|" Formula/caddy-hot-reloader.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha256 }}\"|" Formula/caddy-hot-reloader.rb
          if git diff --quiet; then
            echo "Formula already up to date for ${{ steps.release.outputs.version }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/caddy-hot-reloader.rb
          git commit -m "chore: update formula to ${{ steps.release.outputs.version }}"
          git push origin main
